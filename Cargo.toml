[package]
name = "npc"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/rust/lib.rs"

[[bin]]
name = "npc"
path = "src/rust/main.rs"

[dependencies]
autocxx = "0.26"
cxx = "1"
miette = { version = "5", features = ["fancy"] }
rustyline = "15"
signal-hook = "0.4.3"

[build-dependencies]
autocxx-build = "0.26"
cc = "1"
miette = { version = "5", features = ["fancy"] }
