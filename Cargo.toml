[package]
name = "npc"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[lib]
path = "src/rust/lib.rs"

[[bin]]
name = "npc"
path = "src/rust/main.rs"

[dependencies]
autocxx = "0.26"
capstone = "0.14.0"
clap = { version = "4", features = ["derive"] }
cxx = "1"
env_logger = "0.11.9"
log = "0.4.29"
miette = { version = "5", features = ["fancy"] }
object = "0.38.1"
rustyline = "15"
signal-hook = "0.4.3"

[build-dependencies]
autocxx-build = "0.26"
cc = "1"
miette = { version = "5", features = ["fancy"] }
